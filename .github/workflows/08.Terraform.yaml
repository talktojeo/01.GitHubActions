name: 08.Terraform Layer Concept

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  L100-Job:
    name: L100-Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/L100
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform/L100
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform/L100
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./terraform/L100
        run: terraform apply -auto-approve

      - name: Terraform Output
        working-directory: ./terraform/L100
        run: terraform output
  L200-Job:
    name: L200-Job
    runs-on: ubuntu-latest
    needs: L100-Job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/L200
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform/L200
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform/L200
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./terraform/L200
        run: terraform apply -auto-approve

      - name: Terraform Output
        working-directory: ./terraform/L200
        run: terraform output

